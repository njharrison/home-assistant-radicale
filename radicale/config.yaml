name: Radicale
version: "0.3.4"
slug: radicale
description: Lightweight CalDAV and CardDAV server for Home Assistant
url: https://github.com/njharrison/home-assistant-radicale
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
webui: "https://harrison-household.duckdns.org/"
ports:
  443/tcp: 443
ports_description:
  443/tcp: Radicale CalDAV/CardDAV HTTPS
options:
  username: homeassistant
  password: ""
  domain: "harrison-household.duckdns.org"
  duckdns_token: ""
schema:
  username: str
  password: password
  domain: str
  duckdns_token: password
